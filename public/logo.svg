<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="ClearRoute">
  <!--
    The ClearRoute mark, matching the wordmark glyph in the nav bar: a flat amber
    tile, a dark 2px-equivalent outline and a bold "C". Drawn as geometry rather
    than text so it renders identically at 16px with no webfont loaded, and with
    a fixed palette so it stays legible on both light and dark browser chrome.

    Tile:   #ffd34d  (--nb-amber)
    Outline + letter: #0c0c0e  (--nb-deep)
  -->
  <rect x="2" y="2" width="60" height="60" fill="#ffd34d" stroke="#0c0c0e" stroke-width="4"/>
  <path d="M45 22.4A15 15 0 1 0 45 41.6" fill="none" stroke="#0c0c0e" stroke-width="9"/>
</svg>
