<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-label="ClearRoute">
  <!--
    The ClearRoute mark — the same glyph the wordmark renders and the same file
    served as the app favicon (public/favicon.svg): an amber tile, a dark outline
    and a bold "C", drawn as geometry so it needs no webfont and stays crisp when
    scaled down.

    Tile:   #ffd34d  (--nb-amber)
    Outline + letter: #0c0c0e  (--nb-deep)
  -->
  <rect x="2" y="2" width="60" height="60" fill="#ffd34d" stroke="#0c0c0e" stroke-width="4"/>
  <path d="M45 22.4A15 15 0 1 0 45 41.6" fill="none" stroke="#0c0c0e" stroke-width="9"/>
</svg>
