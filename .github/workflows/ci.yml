name: CI

# Runs on every pull request and on main itself, so a bad merge is caught before
# it lands rather than after.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pure pipeline is where the regressions actually happen: intent
      # parsing, normalizers, de-duplication and the scorer. 235 tests, no
      # network and no deployment required.
      - name: Tests
        run: bun test

      # The sync ships whole trees, so an environment file reaching the repo is
      # the one mistake that would leak credentials. `.env.example` is the only
      # env file allowed to be tracked.
      - name: No environment files committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked environment files: $tracked"
            exit 1
          fi
          echo "OK — no tracked env files (.env.example is the only exception)."

# NOT INCLUDED ON PURPOSE: `tsc -b --noEmit`.
#
# `src/convex/_generated/` is gitignored — it is produced by `convex dev` — so a
# fresh clone has no Convex types and the frontend cannot be typechecked here.
# Typecheck currently runs in two places instead:
#   * locally, after `bun convex dev --once`
#   * on the Freebuff platform after every change
#
# To move typecheck into CI, add a CONVEX_DEPLOY_KEY repository secret and give
# this workflow a job that runs `bunx convex deploy` (or `codegen`) before
# `bun tsc -b --noEmit`. That needs a Convex account, which is part of the
# decision to leave the current host.
